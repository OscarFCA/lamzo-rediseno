<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="alternate" type="text/markdown" href="llms.txt" title="llms.txt — Lamzo Design Studio para modelos de IA">
<title>Proyectos de interiorismo — Lamzo Design Studio</title>
<meta name="description" content="Proyectos de Lamzo Design Studio: residencias, departamentos, restaurantes, paisajismo y mobiliario propio. Meseta, Villa Acapulco, Naranjos, Elevia y más.">
<link rel="canonical" href="https://www.lamzo.mx/proyectos">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&amp;family=Montserrat:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#FFFFFF;color:#111111;-webkit-font-smoothing:antialiased;}
*{box-sizing:border-box;}
a{color:#111111;text-underline-offset:5px;}
a:hover{color:#6E665E;}
</style>
</helmet>
<div style="font-family:'Montserrat',sans-serif;font-size:16px;line-height:1.7;color:#111111;">
<dc-import name="Lamzo Header" style="position:sticky;top:0;z-index:50;" active="proyectos" hint-size="100%,97px"></dc-import>
<main>
  <section data-screen-label="Portada" style="position:relative;height:62vh;min-height:440px;max-height:720px;background:#111111;overflow:hidden;">
    <img src="img/sitio/1481148229474-TN6QL68TZJQFRCAAU1C2.webp" alt="Sala de Villa Acapulco, proyecto de Lamzo Design Studio" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
    <div style="position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.35) 50%, rgba(0,0,0,0.1) 100%);"></div>
    <div style="position:absolute;inset:24px;border:1px solid rgba(255,255,255,0.28);pointer-events:none;"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;padding:0 clamp(40px,6vw,96px) clamp(48px,7vh,80px);display:flex;flex-direction:column;gap:18px;color:#FFFFFF;max-width:900px;">
      <p style="margin:0;font-size:12px;letter-spacing:0.32em;text-transform:uppercase;">Portafolio · 2015 a hoy</p>
      <h1 style="margin:0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(40px,6vw,84px);line-height:1;letter-spacing:0.1em;text-transform:uppercase;">Proyectos</h1>
      <p style="margin:0;max-width:520px;font-weight:300;text-wrap:pretty;">Residencias, departamentos, espacios comerciales, jardines y mobiliario diseñados por Lamzo Design Studio.</p>
    </div>
  </section>
  <section data-screen-label="Listado" style="padding:clamp(72px,9vw,120px) clamp(20px,4vw,64px) clamp(120px,14vw,180px);">
    <div style="max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:64px;">
      <div role="group" aria-label="Filtrar por categoría" style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px 40px;border-bottom:1px solid #E2DEDA;padding-bottom:20px;">
        <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
          <button type="button" onClick="{{ f.pick }}" aria-pressed="{{ f.on }}" style="font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:0.28em;text-transform:uppercase;padding:10px 0;border:none;border-bottom:1px solid {{ f.border }};margin-bottom:-21px;background:none;cursor:pointer;color:{{ f.color }};display:flex;gap:10px;align-items:baseline;">{{ f.label }}<span style="font-family:'Bodoni Moda',serif;font-style:italic;font-size:14px;letter-spacing:0;text-transform:none;">{{ f.count }}</span></button>
        </sc-for>
      </div>
      <ul style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:72px 32px;">
        <sc-for list="{{ items }}" as="p" hint-placeholder-count="9">
          <li style="display:flex;flex-direction:column;gap:18px;">
            <div style="aspect-ratio:4/5;background:#EDEBE9;position:relative;overflow:hidden;">
              <img src="{{ p.cover }}" alt="{{ p.alt }}" loading="lazy" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;">
            </div>
            <a href="{{ p.href }}" style="display:flex;flex-direction:column;gap:6px;text-decoration:none;">
              <span style="font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:#6E665E;">{{ p.cat }}</span>
              <span style="font-family:'Bodoni Moda',serif;font-size:24px;letter-spacing:0.12em;text-transform:uppercase;line-height:1.2;">{{ p.name }}</span>
              <span style="font-size:13px;color:#555555;letter-spacing:0.03em;">{{ p.meta }}</span>
            </a>
          </li>
        </sc-for>
      </ul>
    </div>
  </section>
  <section style="padding:clamp(96px,12vw,160px) 20px;background:#111111;color:#FFFFFF;text-align:center;">
    <div style="max-width:720px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:28px;">
      <p style="margin:0;font-size:12px;letter-spacing:0.32em;text-transform:uppercase;color:#D9D3CC;">Asesoría personalizada</p>
      <h2 style="margin:0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(30px,4vw,52px);line-height:1.15;letter-spacing:0.1em;text-transform:uppercase;">Su próximo <span style="font-style:italic;text-transform:none;letter-spacing:0.02em;">proyecto</span></h2>
      <a href="contacto.html" style="font-size:12px;letter-spacing:0.28em;text-transform:uppercase;text-decoration:none;color:#111111;background:#FFFFFF;padding:16px 36px;" style-hover="background:#E2DEDA;color:#111111;">Agendar asesoría</a>
    </div>
  </section>
</main>
<dc-import name="Lamzo Footer" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { data: [], cat: 'Todos' };
  componentDidMount() { import('./lamzo-data.js').then(m => this.setState({ data: m.PROJECTS })); }
  renderVals() {
    const cats = ['Todos', 'Residencial', 'Comercial', 'Paisajismo', 'Mobiliario'];
    const c = this.state.cat, d = this.state.data;
    return {
      filters: cats.map(k => ({ label: k, count: d.length ? String(k === 'Todos' ? d.length : d.filter(p => p.cat === k).length) : '', on: k === c ? 'true' : 'false', border: k === c ? '#111111' : 'transparent', color: k === c ? '#111111' : '#555555', pick: () => this.setState({ cat: k }) })),
      items: d.filter(p => c === 'Todos' || p.cat === c).map(p => ({
        name: p.name, cat: p.cat, slotId: 'cover-' + p.slug, cover: p.thumb || p.cover || undefined, alt: p.name + ' — ' + (p.tipo || p.cat) + ', Lamzo Design Studio',
        ph: 'Portada · ' + p.name,
        meta: [p.tipo, p.ubicacion, p.superficie].filter(Boolean).join(' · ') || 'Interiorismo',
        href: 'proyecto.html?p=' + p.slug
      }))
    };
  }
}
</script>
</body>
</html>
